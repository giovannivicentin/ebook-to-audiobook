    <script>
      (function () {
        try {
          var t = localStorage.getItem("ebook-audio-theme");
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-theme", t);
            return;
          }
        } catch (e) {}
        document.documentElement.setAttribute(
          "data-theme",
          window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light",
        );
      })();
    </script>
